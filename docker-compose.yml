
services:
  python-yolo-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: python-yolo-service

    ports:
      - "${PYTHON_YOLO_PORT:-8000}:8000"

    environment:
      - PYTHON_YOLO_PORT=${PYTHON_YOLO_PORT:-8000}
      - STREAM_URL=${STREAM_URL:-0}
      - SPRING_URL=${SPRING_URL:-http://localhost:8080}
      - SPRING_IMAGES_URL=${SPRING_IMAGES_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - SAMPLE_ENABLED=${SAMPLE_ENABLED:-true}
      - SAMPLE_MIN_S=${SAMPLE_MIN_S:-30}
      - SAMPLE_MAX_S=${SAMPLE_MAX_S:-120}
      - JPEG_QUALITY_SAMPLE=${JPEG_QUALITY_SAMPLE:-90}
      - PICAM_FORMAT=${PICAM_FORMAT:-BGR888}

    # libcamera necesita dispositivos de la Raspberry Pi
    privileged: true

    volumes:
      - /run/udev:/run/udev:ro

    group_add:
      - video

    networks:
      - cut_ia_network

    restart: on-failure

networks:
  cut_ia_network:
    external: true
